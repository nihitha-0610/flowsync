networks:
  flowsync-network:
    name: flowsync-network
    driver: bridge

volumes:
  kafka_data:
    name: flowsync_kafka_data
  postgres_data:
    name: flowsync_postgres_data
  minio_data:
    name: flowsync_minio_data
  prometheus_data:
    name: flowsync_prometheus_data
  grafana_data:
    name: flowsync_grafana_data

services:
  # ============================================================================
  # 1. Apache Kafka (KRaft Mode - No ZooKeeper)
  # ============================================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: flowsync-kafka
    hostname: kafka
    restart: unless-stopped
    networks:
      - flowsync-network
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  # Init container to ensure all required topics exist with 3 partitions
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: flowsync-kafka-init
    networks:
      - flowsync-network
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/init_topics.sh:/usr/local/bin/init_topics.sh:ro
    entrypoint: [ "/bin/bash", "/usr/local/bin/init_topics.sh" ]

  # ============================================================================
  # 2. PostgreSQL 16 (Operational & Quarantine Database)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: flowsync-postgres
    hostname: postgres
    restart: unless-stopped
    networks:
      - flowsync-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowsync_db}
      POSTGRES_USER: ${POSTGRES_USER:-flowsync_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowsync_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowsync_user} -d ${POSTGRES_DB:-flowsync_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 3. MinIO (S3-Compatible Object Storage & Analytical Parquet Lake)
  # ============================================================================
  minio:
    # Original tag: alpine/minio:latest-release
    image: alpine/minio@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4
    container_name: flowsync-minio
    hostname: minio
    user: "0:0"
    restart: unless-stopped
    networks:
      - flowsync-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowsync_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flowsync_minio_secret_key}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/live > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Init container to automatically and idempotently provision MinIO buckets
  minio-init:
    image: flowsync-minio-init:latest
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    container_name: flowsync-minio-init
    networks:
      - flowsync-network
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowsync_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flowsync_minio_secret_key}

  # ============================================================================
  # 4. Prometheus (Time-Series Metric Collector)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: flowsync-prometheus
    hostname: prometheus
    restart: unless-stopped
    networks:
      - flowsync-network
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 5. Grafana (Pipeline Observability & Metric Dashboards)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.2
    container_name: flowsync-grafana
    hostname: grafana
    restart: unless-stopped
    networks:
      - flowsync-network
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-flowsync_grafana_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: "warn"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # 6. Spark Structured Streaming Engine (Phase 4 Real-time Processing)
  # ============================================================================
  spark-streaming:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: flowsync-spark-streaming
    hostname: spark-streaming
    init: true
    profiles:
      - streaming
    restart: "no"
    networks:
      - flowsync-network
    ports:
      - "4040:4040"
      - "8001:8000"
    environment:
      SPARK_MASTER: "local[2]"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC_RAW: "events.raw"
      KAFKA_TOPIC_DLQ: "events.dlq"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowsync_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flowsync_minio_secret_key}
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-flowsync_db}
      POSTGRES_USER: ${POSTGRES_USER:-flowsync_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowsync_secure_password}
      STREAMING_METRICS_PORT: 8000
    volumes:
      - .:/app
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # ============================================================================
  # 7. FastAPI Backend Service (Telemetry Ingestion & Control Plane API)
  # ============================================================================
  backend:
    image: flowsync-backend:v2
    container_name: flowsync-backend
    hostname: backend
    restart: unless-stopped
    networks:
      - flowsync-network
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC_RAW: "events.raw"
      KAFKA_TOPIC_DLQ: "events.dlq"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-flowsync_db}
      POSTGRES_USER: ${POSTGRES_USER:-flowsync_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowsync_secure_password}
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowsync_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flowsync_minio_secret_key}
      PYTHONPATH: "/app/backend:/app"
    working_dir: /app/backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./backend:/app/backend
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

